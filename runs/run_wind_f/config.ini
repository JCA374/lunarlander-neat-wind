# Run F: leaky linear memory. Every network starts with 2 memory nodes (num_hidden = 2): each sees every
# input, feeds every output, is linear (no tanh, no bias) and has a loop to itself fixed at 0.9, so it keeps
# a fading sum of recent inputs that can't saturate (LeakyMemoryGenome in neat_lander/genome.py). They can't
# be deleted or retuned. Run E's loop of 1.0 with tanh saturated. Changes from neat-config.ini are marked 'was'.
# Every network starts minimal: the 8 inputs wired straight to the 4 outputs, no hidden nodes.
# Evolution adds hidden nodes and connections only when they pay off.

[NEAT]
fitness_criterion     = max
# "Solved" in LunarLander = average reward >= 200. train.py checks it on 100 unseen episodes.
fitness_threshold     = 200
# Run the full generation budget instead of stopping at the first lucky score
no_fitness_termination = True
pop_size              = 150
reset_on_extinction   = False

[LeakyMemoryGenome]
# --- network shape ---
num_inputs              = 8
num_outputs             = 4
# was 0: 2 protected memory nodes (see neat_lander/genome.py)
num_hidden              = 2
# loops allowed: the network can remember (see make_net)
feed_forward            = False
initial_connection      = full_direct

# --- nodes: one fixed activation, so only weights, biases and topology evolve ---
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# --- weights ---
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

# --- structural mutations: how the topology grows ---
# was 0.2: run A grew 28 hidden nodes that did not help
node_add_prob           = 0.05
node_delete_prob        = 0.05
# was 0.5
conn_add_prob           = 0.2
conn_delete_prob        = 0.1
enabled_default         = True
enabled_mutate_rate     = 0.01

# --- speciation: how different two genomes are (disjoint genes + weight differences) ---
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 2.2

[DefaultStagnation]
species_fitness_func = max
# was 20: with noisy wind scores, give species longer
max_stagnation       = 40
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size   = 2
